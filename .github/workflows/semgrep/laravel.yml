name: Semgrep Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  semgrep-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep with local rules
        run: |
          pip install semgrep
          semgrep scan --config=semgrep-laravel.yaml --error